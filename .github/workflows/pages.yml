name: 发布翻书目录
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 21 * * *'
  workflow_dispatch:
    inputs:
      update:
        description: 从番茄更新书目
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: fanshu-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: 留存今日官方阅读榜和新书榜
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/history.mjs || echo "::warning::当天没有可用榜单，已记录上游错误。"
          bash scripts/save-history.sh
      - name: 准备网页并保留上次书目
        shell: bash
        run: |
          mkdir _site
          cp index.html catalog.gz _site/
          code=$(curl --retry 2 --max-time 90 --silent --show-error --output previous.gz --write-out '%{http_code}' "https://qianxu566-debug.github.io/fanshu-reader/catalog.gz?t=$GITHUB_RUN_ID")
          case "$code" in
            200) gzip -t previous.gz && mv previous.gz _site/catalog.gz ;;
            404) echo '使用首次发布书目' ;;
            *) echo "读取已发布书目失败 $code"; exit 1 ;;
          esac
      - name: 请求番茄官方书目
        id: update
        timeout-minutes: 16
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update)
        continue-on-error: true
        run: python3 scripts/update.py _site/catalog.gz
      - name: 追加今天实际更新的书目在读值
        if: github.ref == 'refs/heads/main' && (steps.update.outcome == 'success' || steps.update.outcome == 'failure')
        run: |
          node scripts/history.mjs _site/catalog.gz --observations-only || echo "::warning::当天没有可用榜单。"
          bash scripts/save-history.sh
      - name: 准备榜单日期索引
        run: |
          mkdir -p _site/history
          python3 - <<'PY'
          import gzip,json,pathlib,shutil
          out=pathlib.Path('_site/history')
          dates=[]
          for f in sorted(pathlib.Path('history').glob('*.json.gz'),reverse=True)[:90]:
              if any(s['ok'] for s in json.load(gzip.open(f))['scopes']):
                  shutil.copyfile(f,out/f.name)
                  dates.append(f.name[:10])
          (out/'index.json').write_text(json.dumps(dates))
          PY
      - name: 从上一次未部署的产物恢复直链
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prior=$(gh run list --workflow pages.yml --branch main --limit 4 --json databaseId,conclusion --jq 'map(select(.databaseId != '"$GITHUB_RUN_ID"')) | .[0] | select(.conclusion == "failure") | .databaseId')
          if [[ -n "$prior" ]] && gh run download "$prior" -n github-pages -D recovered-artifact; then
            mkdir -p recovery
            tar -xOf recovered-artifact/artifact.tar ./catalog.gz > recovery/catalog.gz
            gzip -t recovery/catalog.gz
          fi
      - name: 刷新番茄官方封面直链
        id: covers
        continue-on-error: true
        run: node scripts/covers.mjs _site/catalog.gz
      - name: 核验目录
        run: |
          python3 - <<'PY'
          import gzip,json
          b=json.load(gzip.open('_site/catalog.gz'))['books']
          assert b and len(b)==len({x['id'] for x in b})
          assert all(x['readers']>=8000 for x in b)
          print(f'{len(b)} 本')
          PY
      - name: 记录上游异常
        if: steps.update.outcome == 'failure' || steps.covers.outcome == 'failure'
        run: echo "::warning::上游更新部分失败，本次发布保留已核验结果。"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
